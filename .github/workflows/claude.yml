name: Claude (API)

# Chạy được trên MỌI nhánh:
#  1) Chạy tay: tab Actions -> "Claude (API)" -> Run workflow -> chọn nhánh bất kỳ + gõ việc cần làm
#  2) Gõ "@claude ..." trong comment của issue hoặc pull request
#  3) Tự rà soát mọi pull request (từ bất kỳ nhánh nào trong kho này)
# Cần secret ANTHROPIC_API_KEY (Settings -> Secrets and variables -> Actions).

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Việc cần Claude làm trên nhánh đã chọn"
        required: true
        default: "Rà soát index.html tìm lỗi logic (lịch trùng, ngày nhắc, điểm danh, chốt lớp) và sửa nếu chắc chắn."
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  claude:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >-
            ${{ github.event_name == 'pull_request'
            && 'Review this pull request for index.html (a Vietnamese class-schedule manager for TOEIC Thầy Khuê). Report real logic bugs, broken date handling and UI regressions only. Be concise and reply in Vietnamese.'
            || inputs.prompt }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 15
